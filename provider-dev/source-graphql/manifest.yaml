# GraphQL operations merged into the generated ovh provider by
# provider-dev/scripts/graphql_merge.mjs (the last step of `make generate`).
#
# OVHcloud publishes no GraphQL API: the control plane is the REST API v1 and
# v2 documents pinned under provider-dev/downloaded. `ops` is therefore empty
# and the merge is a no-op. The directory is kept so the pipeline step and
# the shape are in place if OVHcloud ever publishes one.
#
# Each entry under `ops` would name a fragment in ./ops/ with: service,
# resource, title, description, parameters (plain OpenAPI parameter objects),
# selection (a plain dotted JSONPath to the row array, no [*]), optional
# cursor, optional transform, query (a Go template) and rowSchema. See the
# stackql-provider-development skill, graphql-merge.md.

services: {}

ops: []
