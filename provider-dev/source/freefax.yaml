openapi: 3.0.0
info:
  title: OVHcloud Freefax API
  description: 'Freefax lines: settings, voicemail and directory.'
  version: '1.0'
  x-stackQL-apiVersion: v1
  x-stackQL-specFamily: v1/freefax
paths:
  /freefax:
    get:
      summary: List Freefax line accounts
      security:
        - oAuth2AuthCode: []
      parameters:
        - in: query
          name: iamTags
          description: Filter resources on IAM tags
          schema:
            type: object
            additionalProperties:
              type: array
              items:
                $ref: '#/components/schemas/iam.resource.TagFilter'
        - in: header
          name: X-Pagination-Mode
          description: Sent as CachedObjectList-Pages by default so the list returns the full objects rather than their identifiers.
          required: false
          schema:
            type: string
            default: CachedObjectList-Pages
      responses:
        '200':
          description: successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Get_v1_freefaxResponse'
      x-developer-hub-navigation:
        - - Web Cloud
          - Fax
      x-badges:
        - color: green
          label: Stable production version
      x-iam-actions:
        - name: freefax:apiovh:get
          required: true
      x-expanded-response: FreefaxFreefaxPropertiesWithIAM
      operationId: get_v1_freefax
      description: List Freefax line accounts
      x-stackql-bare-array-wrap:
        wrapperKey: v1_freefax
        wrapperName: Get_v1_freefaxResponse
        mediaType: application/json
        scalar: false
  /freefax/credits:
    get:
      summary: Get the credit balance and the remaining pages available for all our freefax
      security:
        - oAuth2AuthCode: []
      responses:
        '200':
          description: successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/freefax.BalanceInformations'
      x-developer-hub-navigation:
        - - Web Cloud
          - Fax
      x-badges:
        - color: green
          label: Stable production version
      x-iam-actions:
        - name: account:apiovh:freefax/credits/get
          required: true
      operationId: get_v1_freefax_credits
      description: Get the credit balance and the remaining pages available for all our freefax
  /freefax/{serviceName}:
    get:
      summary: Get Freefax information
      security:
        - oAuth2AuthCode: []
      parameters:
        - in: path
          name: serviceName
          description: Service name
          required: true
          schema:
            $ref: '#/components/schemas/phoneNumber'
      responses:
        '200':
          description: successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/freefax.FreefaxPropertiesWithIAM'
      x-developer-hub-navigation:
        - - Web Cloud
          - Fax
      x-badges:
        - color: green
          label: Stable production version
      x-iam-actions:
        - name: freefax:apiovh:get
          required: true
      operationId: get_v1_freefax_service_name
      description: Get Freefax information
    put:
      summary: Edit the Freefax properties
      security:
        - oAuth2AuthCode: []
      parameters:
        - in: path
          name: serviceName
          description: Service name
          required: true
          schema:
            $ref: '#/components/schemas/phoneNumber'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/freefax.FreefaxProperties'
      responses:
        '200':
          description: successful operation
      x-developer-hub-navigation:
        - - Web Cloud
          - Fax
      x-badges:
        - color: green
          label: Stable production version
      x-iam-actions:
        - name: freefax:apiovh:put
          required: true
      operationId: put_v1_freefax_service_name
      description: Edit the Freefax properties
  /freefax/{serviceName}/changePassword:
    post:
      summary: Generates a new password for your fax account
      security:
        - oAuth2AuthCode: []
      parameters:
        - in: path
          name: serviceName
          description: Service name
          required: true
          schema:
            $ref: '#/components/schemas/phoneNumber'
      responses:
        '200':
          description: successful operation
          content:
            application/json:
              schema:
                type: string
                format: password
      x-developer-hub-navigation:
        - - Web Cloud
          - Fax
      x-badges:
        - color: green
          label: Stable production version
      x-iam-actions:
        - name: freefax:apiovh:changePassword
          required: true
      operationId: post_v1_freefax_service_name_change_password
      description: Generates a new password for your fax account
  /freefax/{serviceName}/directory:
    get:
      summary: Get Freefax directory information
      security:
        - oAuth2AuthCode: []
      parameters:
        - in: path
          name: serviceName
          description: Service name
          required: true
