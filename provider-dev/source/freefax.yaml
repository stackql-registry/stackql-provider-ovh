          required: true
      operationId: get_v1_freefax_service_name_service_infos
      description: Get service information
    put:
      summary: Update service information
      security:
        - oAuth2AuthCode: []
      parameters:
        - in: path
          name: serviceName
          description: Service name
          required: true
          schema:
            $ref: '#/components/schemas/phoneNumber'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/services.Service'
      responses:
        '200':
          description: successful operation
      x-developer-hub-navigation:
        - - Web Cloud
          - Fax
      x-badges:
        - color: green
          label: Stable production version
      x-iam-actions:
        - name: freefax:apiovh:serviceInfos/edit
          required: true
      operationId: put_v1_freefax_service_name_service_infos
      description: Update service information
  /freefax/{serviceName}/voicemail:
    get:
      summary: Get the Freefax voicemail information
      security:
        - oAuth2AuthCode: []
      parameters:
        - in: path
          name: serviceName
          description: Service name
          required: true
          schema:
            $ref: '#/components/schemas/phoneNumber'
      responses:
        '200':
          description: successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/telephony.VoicemailProperties'
      x-developer-hub-navigation:
        - - Web Cloud
          - Fax
      x-badges:
        - color: green
          label: Stable production version
      x-iam-actions:
        - name: freefax:apiovh:voicemail/get
          required: true
      operationId: get_v1_freefax_service_name_voicemail
      description: Get the Freefax voicemail information
    put:
      summary: Edit the Freefax voicemail
      security:
        - oAuth2AuthCode: []
      parameters:
        - in: path
          name: serviceName
          description: Service name
          required: true
          schema:
            $ref: '#/components/schemas/phoneNumber'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/telephony.VoicemailProperties'
      responses:
        '200':
          description: successful operation
      x-developer-hub-navigation:
        - - Web Cloud
          - Fax
      x-badges:
        - color: green
          label: Stable production version
      x-iam-actions:
        - name: freefax:apiovh:voicemail/edit
          required: true
      operationId: put_v1_freefax_service_name_voicemail
      description: Edit the Freefax voicemail
  /freefax/{serviceName}/voicemail/changePassword:
    post:
      summary: Change the voicemail password. It must be 4 digit
      security:
        - oAuth2AuthCode: []
      parameters:
        - in: path
          name: serviceName
          description: Service name
          required: true
          schema:
            $ref: '#/components/schemas/phoneNumber'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/telephony.voicemail.ChangePassword'
      responses:
        '200':
          description: successful operation
      x-developer-hub-navigation:
        - - Web Cloud
          - Fax
      x-badges:
        - color: green
          label: Stable production version
      x-iam-actions:
        - name: freefax:apiovh:voicemail/changePassword
          required: true
      operationId: post_v1_freefax_service_name_voicemail_change_password
      description: Change the voicemail password. It must be 4 digit
  /freefax/{serviceName}/voicemail/changeRouting:
    post:
      summary: Disable/Enable voicemail. Available only if the line has fax capabilities
      security:
        - oAuth2AuthCode: []
      parameters:
        - in: path
          name: serviceName
          description: Service name
          required: true
          schema:
            $ref: '#/components/schemas/phoneNumber'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/telephony.voicemail.ChangeRouting'
      responses:
        '200':
          description: successful operation
      x-developer-hub-navigation:
        - - Web Cloud
          - Fax
      x-badges:
        - color: green
          label: Stable production version
      x-iam-actions:
        - name: freefax:apiovh:voicemail/changeRouting
          required: true
      operationId: post_v1_freefax_service_name_voicemail_change_routing
      description: Disable/Enable voicemail. Available only if the line has fax capabilities
  /freefax/{serviceName}/voicemail/routing:
    get:
      summary: Get the status of the voicemail. Available only if the line has fax capabilities
      security:
        - oAuth2AuthCode: []
      parameters:
        - in: path
          name: serviceName
          description: Service name
          required: true
          schema:
            $ref: '#/components/schemas/phoneNumber'
      responses:
        '200':
          description: successful operation
          content:
            application/json:
              schema:
                type: object
                properties:
                  value:
                    type: string
                    description: All existing type of routing for a voicemail
                    enum:
                      - fax
                      - voicemail
      x-developer-hub-navigation:
        - - Web Cloud
          - Fax
      x-badges:
        - color: green
          label: Stable production version
      x-iam-actions:
        - name: freefax:apiovh:voicemail/routing/get
          required: true
      operationId: get_v1_freefax_service_name_voicemail_routing
      x-stackQL-scalarWrap:
        column: value
        type: string
      description: Get the status of the voicemail. Available only if the line has fax capabilities
  /freefax/{serviceName}/voicemail/voicemailNumbers:
    get:
      summary: Get number for internal and external voicemail
      security:
        - oAuth2AuthCode: []
      parameters:
        - in: path
          name: serviceName
          description: Service name
          required: true
          schema:
            $ref: '#/components/schemas/phoneNumber'
      responses:
        '200':
          description: successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/telephony.VoicemailNumbers'
      x-developer-hub-navigation:
        - - Web Cloud
          - Fax
      x-badges:
        - color: green
          label: Stable production version
      x-iam-actions:
        - name: freefax:apiovh:voicemail/voicemailNumbers/get
          required: true
      operationId: get_v1_freefax_service_name_voicemail_voicemail_numbers
      description: Get number for internal and external voicemail
components:
  schemas:
    iam.resource.TagFilter:
      type: object
      description: Resource tag filter
      properties:
        operator:
          description: Operator to use in order to filter on the value (defaults to 'EQ')
          nullable: true
          readOnly: true
          type: string
          enum:
            - EQ
            - EXISTS
            - ILIKE
            - LIKE
            - NEQ
            - NEXISTS
        value:
          type: string
          description: Value to use in order to filter tags
          readOnly: true
    phoneNumber:
      type: string
      description: Phone number
      format: phone-number
    freefax.BalanceInformations:
      type: object
      description: Return credit balance information structure
      properties:
        faxs:
          type: integer
          description: The number of equivalement remaining french faxs
          readOnly: true
        points:
          type: integer
          description: Total balance available in points
          readOnly: true
    freefax.FreefaxPropertiesWithIAM:
      type: object
      description: Freefax properties
      properties:
        faxMaxCall:
          description: Number of tries when sending a fax
          type: integer
          enum:
            - 1
            - 2
            - 3
            - 4
            - 5
            - 6
            - 7
            - 8
            - 9
        faxQuality:
          description: Available quality for fax documents
          type: string
          enum:
            - best
            - high
            - normal
        faxTagLine:
          type: string
          description: Customised freefax header
        fromEmail:
          type: string
          description: FROM email header
        fromName:
          type: string
          description: Name of the sender of the email
        iam:
          description: IAM resource metadata
          nullable: true
          readOnly: true
          type: object
          properties:
            displayName:
              type: string
              description: Resource display name
              nullable: true
              readOnly: true
            id:
              type: string
              description: Unique identifier of the resource
              format: uuid
              readOnly: true
            state:
              description: Resource state
              nullable: true
              readOnly: true
              type: string
              enum:
                - EXPIRED
                - IN_CREATION
                - OK
                - SUSPENDED
            tags:
              type: object
              description: 'Resource tags. Tags that were internally computed are prefixed with ovh:'
              nullable: true
              additionalProperties:
                type: string
              readOnly: true
            urn:
              type: string
              description: Unique resource name used in policies
              readOnly: true
        number:
          description: Phone number
          readOnly: true
          type: string
          format: phone-number
        redirectionEmail:
          type: array
          description: Email address to redirect fax response.
          items:
            type: string
    freefax.FreefaxProperties:
      type: object
      description: Freefax properties
      properties:
        faxMaxCall:
          description: Number of tries when sending a fax
          type: integer
          enum:
            - 1
            - 2
            - 3
            - 4
            - 5
            - 6
            - 7
            - 8
            - 9
        faxQuality:
          description: Available quality for fax documents
          type: string
          enum:
            - best
            - high
            - normal
        faxTagLine:
          type: string
          description: Customised freefax header
        fromEmail:
          type: string
          description: FROM email header
        fromName:
          type: string
          description: Name of the sender of the email
        number:
          description: Phone number
          readOnly: true
          type: string
          format: phone-number
        redirectionEmail:
          type: array
          description: Email address to redirect fax response.
          items:
            type: string
    telephony.DirectoryInfo:
      type: object
      description: Directory information
      properties:
        PJSocialNomination:
          type: string
        address:
          type: string
        addressExtra:
          type: string
        ape:
          type: string
        areaCode:
          type: integer
          readOnly: true
        birthDate:
          type: string
          nullable: true
          format: date
        cedex:
          type: string
        city:
          type: string
        country:
          type: string
        directoryServiceCode:
          type: string
        displayFirstName:
          type: boolean
        displayMarketingDirectory:
          type: boolean
        displayOnlyCity:
          type: boolean
        displaySearchReverse:
          type: boolean
        displayUniversalDirectory:
          type: boolean
        email:
          type: string
        firstName:
          type: string
        gender:
          description: All genders a person can choose
          type: string
          enum:
            - female
            - male
        inseeCode:
          type: integer
          readOnly: true
        legalForm:
          type: string
        lineDescription:
          type: string
        modificationDate:
          type: string
          readOnly: true
        modificationType:
          type: string
          readOnly: true
        name:
          type: string
        number:
          type: string
          readOnly: true
        occupation:
          type: string
        postBox:
          type: string
        postCode:
          type: string
        receivePJDirectory:
          type: boolean
        siret:
          type: string
        socialNomination:
          type: string
        socialNominationExtra:
          type: string
        status:
          type: string
          readOnly: true
        urbanDistrict:
          type: string
        wayName:
          type: string
        wayNumber:
          type: string
        wayNumberExtra:
          type: string
        wayType:
          type: string
    telephony.EntrepriseNumber:
      type: object
      description: Enterprise number
      properties:
        entrepriseNumber:
          type: string
          description: Entreprise number to fetch information from
      required:
        - entrepriseNumber
    telephony.EntrepriseNumberInformationsTask:
      type: object
      description: Task about getting entreprise information
      properties:
        informations:
          description: Task information about an entreprise
          readOnly: true
          type: object
          properties:
            address:
              type: string
              description: Address of the entreprise
              nullable: true
              readOnly: true
            ape:
              type: string
              description: Entreprise's category code for directory services
              nullable: true
              readOnly: true
            brand:
              type: string
              description: Brand of the entreprise
              nullable: true
              readOnly: true
            entrepriseNumber:
              type: string
              description: Entreprise number
              readOnly: true
            isValid:
              type: boolean
              description: Is this a valid entreprise number?
              readOnly: true
            name:
              type: string
              description: Name of the entreprise
              readOnly: true
            siren:
              type: string
              description: Short version of the entreprise number (FR only)
              nullable: true
              readOnly: true
        status:
          description: Task status
          readOnly: true
          type: string
          enum:
            - doing
            - done
            - error
            - pause
            - todo
    telephony.DirectoryHeadingPJ:
      type: object
      description: Directory information
      properties:
        apeCode:
          type: string
          readOnly: true
        apeDescription:
          type: string
          readOnly: true
        directoryServiceCode:
          type: integer
          readOnly: true
        directoryServiceDescription:
          type: string
          readOnly: true
        notification:
          type: string
          readOnly: true
    telephony.DirectoryWayType:
      type: object
      description: Directory way type
      properties:
        abbreviatedName:
          type: string
          readOnly: true
        wayName:
          type: string
          readOnly: true
    services.Service:
      type: object
      description: Details about a Service
      properties:
        canDeleteAtExpiration:
          type: boolean
          description: Indicates that the service can be set up to be deleted at expiration
          readOnly: true
        contactAdmin:
          type: string
          readOnly: true
        contactBilling:
          type: string
          readOnly: true
        contactTech:
          type: string
          readOnly: true
        creation:
          type: string
