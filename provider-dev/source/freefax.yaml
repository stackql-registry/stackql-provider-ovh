      x-developer-hub-navigation:
        - - Web Cloud
          - Fax
      x-badges:
        - color: green
          label: Stable production version
      x-iam-actions:
        - name: freefax:apiovh:directory/getWayTypes
          required: true
      operationId: get_v1_freefax_service_name_directory_get_way_types
      description: Get all the way types available
      x-stackql-bare-array-wrap:
        wrapperKey: v1_freefax_service_name_directory_get_way_types
        wrapperName: Get_v1_freefax_service_name_directory_get_way_typesResponse
        mediaType: application/json
        scalar: false
  /freefax/{serviceName}/mainService:
    get:
      summary: Get main service attached to the Freefax
      security:
        - oAuth2AuthCode: []
      parameters:
        - in: path
          name: serviceName
          description: Service name
          required: true
          schema:
            $ref: '#/components/schemas/phoneNumber'
      responses:
        '200':
          description: successful operation
          content:
            application/json:
              schema:
                type: object
                properties:
                  value:
                    type: string
      x-developer-hub-navigation:
        - - Web Cloud
          - Fax
      x-badges:
        - color: green
          label: Stable production version
      x-iam-actions:
        - name: freefax:apiovh:mainService/get
          required: true
      operationId: get_v1_freefax_service_name_main_service
      x-stackQL-scalarWrap:
        column: value
        type: string
      description: Get main service attached to the Freefax
  /freefax/{serviceName}/serviceInfos:
    get:
      summary: Get service information
      security:
        - oAuth2AuthCode: []
      parameters:
        - in: path
          name: serviceName
          description: Service name
          required: true
          schema:
