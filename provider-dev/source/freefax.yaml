      x-badges:
        - color: green
          label: Stable production version
      x-iam-actions:
        - name: freefax:apiovh:directory/fetchEntrepriseInformations
          required: true
      operationId: post_v1_freefax_service_name_directory_fetch_entreprise_informations
      description: Get enterprise information by providing enterprise number
  /freefax/{serviceName}/directory/getDirectoryServiceCode:
    get:
      summary: Get directory service code from an APE code (principal activity of the firm code)
      security:
        - oAuth2AuthCode: []
      parameters:
        - in: query
          name: apeCode
          required: true
          schema:
            type: string
        - in: path
          name: serviceName
          description: Service name
          required: true
          schema:
            $ref: '#/components/schemas/phoneNumber'
      responses:
        '200':
          description: successful operation
          content:
            application/json:
              schema:
