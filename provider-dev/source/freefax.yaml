      x-badges:
        - color: green
          label: Stable production version
      x-iam-actions:
        - name: freefax:apiovh:directory/getDirectoryServiceCode
          required: true
      operationId: get_v1_freefax_service_name_directory_get_directory_service_code
      description: Get directory service code from an APE code (principal activity of the firm code)
      x-stackql-bare-array-wrap:
        wrapperKey: v1_freefax_service_name_directory_get_directory_service_code
        wrapperName: Get_v1_freefax_service_name_directory_get_directory_service_codeResponse
        mediaType: application/json
        scalar: false
  /freefax/{serviceName}/directory/getWayTypes:
    get:
      summary: Get all the way types available
      security:
        - oAuth2AuthCode: []
      parameters:
        - in: path
          name: serviceName
          description: Service name
          required: true
          schema:
            $ref: '#/components/schemas/phoneNumber'
      responses:
        '200':
          description: successful operation
          content:
            application/json:
