      x-badges:
        - color: green
          label: Stable production version
      x-iam-actions:
        - name: freefax:apiovh:directory/get
          required: true
      operationId: get_v1_freefax_service_name_directory
      description: Get Freefax directory information
    put:
      summary: Edit Freefax directory information
      security:
        - oAuth2AuthCode: []
      parameters:
        - in: path
          name: serviceName
          description: Service name
          required: true
          schema:
            $ref: '#/components/schemas/phoneNumber'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/telephony.DirectoryInfo'
      responses:
        '200':
          description: successful operation
      x-developer-hub-navigation:
        - - Web Cloud
          - Fax
      x-badges:
        - color: green
          label: Stable production version
      x-iam-actions:
        - name: freefax:apiovh:directory/edit
          required: true
      operationId: put_v1_freefax_service_name_directory
      description: Edit Freefax directory information
  /freefax/{serviceName}/directory/fetchEntrepriseInformations:
