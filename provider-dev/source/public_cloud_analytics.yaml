  /managedAnalytics/clickhouse:
    get:
      operationId: getAllClickhouseServices
      summary: List ClickHouse services
      description: Returns the ClickHouse services of the project. (Beta version)
      security:
        - oAuth2AuthCode: []
      parameters:
        - in: header
          name: X-Pagination-Cursor
          description: Pagination cursor
          schema:
            type: string
        - in: header
          name: X-Pagination-Size
          description: Pagination size
          schema:
            type: integer
