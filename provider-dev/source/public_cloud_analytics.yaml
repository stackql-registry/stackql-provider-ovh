    publicCloud.database.Backup:
      type: object
      description: A backup of a managed database service
      properties:
        checksum:
          type: string
          description: Hash of the resource used for concurrency control
          readOnly: true
        createdAt:
          type: string
          description: Date at which the backup was created
          format: date-time
          readOnly: true
        description:
          type: string
          description: Human-readable description of the backup
          nullable: true
          readOnly: true
        expiredAt:
          type: string
          description: Date until point-in-time recovery is available from this backup
          nullable: true
          format: date-time
          readOnly: true
        id:
          type: string
          description: Unique identifier of the backup
          format: uuid
          readOnly: true
        regions:
          type: array
          description: Regions where this backup is stored
          items:
            $ref: '#/components/schemas/common.RegionEnum'
