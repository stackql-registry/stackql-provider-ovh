openapi: 3.0.0
info:
  title: OVHcloud Public Cloud Analytics (v2) API
  description: Managed analytics services of a Public Cloud project through API v2 (Kafka, OpenSearch, ClickHouse, Grafana and others).
  version: '1.0'
  x-stackQL-apiVersion: v2
  x-stackQL-specFamily: v2/publicCloud
paths:
  /managedAnalytics/availability:
    get:
      operationId: getManagedAnalyticsAvailabilities
      summary: List Analytics availabilities
      description: Returns the combinations of Analytics engine, version, plan and region that can be ordered, with their specifications. Use clusterId with action and target to get the options available for an existing service, for example the plans it can be updated to. (Beta version)
      security:
        - oAuth2AuthCode: []
      parameters:
        - in: header
          name: X-Pagination-Cursor
          description: Pagination cursor
          schema:
            type: string
        - in: header
          name: X-Pagination-Size
          description: Pagination size
          schema:
            type: integer
        - in: query
          name: action
          description: Filter availabilities by action type
          schema:
            $ref: '#/components/schemas/publicCloud.database.availability.ActionEnum'
        - in: query
          name: clusterId
          description: Restrict availabilities to a specific cluster
          schema:
            type: string
            format: uuid
        - in: query
          name: target
          description: Filter availabilities by target type
          schema:
            $ref: '#/components/schemas/publicCloud.database.availability.TargetEnum'
      responses:
        '200':
          description: successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetManagedAnalyticsAvailabilitiesResponse'
      tags:
        - Managed Analytics
        - Capabilities & availability
      x-developer-hub-navigation:
        - - Public Cloud
          - Project Management
          - Service references
          - Analytics
        - - Public Cloud
          - Analytics
          - Service references@@@10
      x-badges:
        - color: blue
          label: Beta version
      x-iam-actions:
        - name: publicCloudProject:apiovh:analytics/availability/get
          required: true
      x-stackql-bare-array-wrap:
        wrapperKey: managed_analytics_availabilities
        wrapperName: GetManagedAnalyticsAvailabilitiesResponse
        mediaType: application/json
        scalar: false
  /managedAnalytics/availability/suggestion:
    get:
      operationId: getManagedAnalyticsAvailabilitySuggestions
      summary: List Analytics availability suggestions
      description: Returns suggested combinations of Analytics engine, version, plan, flavor and region. The default suggestion is marked. (Beta version)
      security:
        - oAuth2AuthCode: []
      parameters:
        - in: header
          name: X-Pagination-Cursor
          description: Pagination cursor
          schema:
            type: string
        - in: header
          name: X-Pagination-Size
          description: Pagination size
          schema:
            type: integer
      responses:
        '200':
          description: successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetManagedAnalyticsAvailabilitySuggestionsResponse'
      tags:
        - Managed Analytics
        - Capabilities & availability
      x-developer-hub-navigation:
        - - Public Cloud
          - Project Management
          - Service references
          - Analytics
        - - Public Cloud
          - Analytics
          - Service references@@@20
      x-badges:
        - color: blue
          label: Beta version
      x-iam-actions:
        - name: publicCloudProject:apiovh:analytics/availability/get
          required: true
      x-stackql-bare-array-wrap:
        wrapperKey: managed_analytics_availability_suggestions
        wrapperName: GetManagedAnalyticsAvailabilitySuggestionsResponse
        mediaType: application/json
        scalar: false
  /managedAnalytics/backup:
    get:
      operationId: getAllManagedAnalyticsBackups
      summary: List backups
      description: Returns the backups of all analytics services of the project, across engines. Filter them by service with the serviceId parameter. (Beta version)
      security:
        - oAuth2AuthCode: []
      parameters:
        - in: header
          name: X-Pagination-Cursor
          description: Pagination cursor
          schema:
            type: string
        - in: header
          name: X-Pagination-Size
          description: Pagination size
          schema:
            type: integer
        - in: query
          name: serviceId
          description: Filter backups by service identifier
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetAllManagedAnalyticsBackupsResponse'
      tags:
        - Managed Analytics
      x-developer-hub-navigation:
        - - Public Cloud
          - Analytics
          - ClickHouse
          - Backups@@@10
        - - Public Cloud
          - Analytics
          - OpenSearch
          - Backups@@@10
      x-badges:
        - color: blue
          label: Beta version
      x-iam-actions:
        - name: publicCloudProject:apiovh:analytics/backup/get
          required: true
      x-response-identifier: id
      x-expanded-response: PublicCloudDatabaseBackup
      x-stackql-bare-array-wrap:
        wrapperKey: managed_analytics_backups
        wrapperName: GetAllManagedAnalyticsBackupsResponse
        mediaType: application/json
        scalar: false
  /managedAnalytics/backup/{backupId}:
    get:
      operationId: getManagedAnalyticsBackup
      summary: Get a backup
      description: Returns the backup type, size, status and storage regions, and the date until which point-in-time recovery is available. (Beta version)
      security:
        - oAuth2AuthCode: []
      parameters:
        - in: path
          name: backupId
          description: Backup ID
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/publicCloud.database.Backup'
      tags:
        - Managed Analytics
      x-developer-hub-navigation:
        - - Public Cloud
          - Analytics
          - ClickHouse
          - Backups@@@20
        - - Public Cloud
          - Analytics
          - OpenSearch
          - Backups@@@20
      x-badges:
        - color: blue
          label: Beta version
      x-iam-actions:
        - name: publicCloudProject:apiovh:analytics/backup/get
          required: true
      x-response-identifier: id
  /managedAnalytics/capabilities/disks:
    get:
      operationId: getManagedAnalyticsDisks
      summary: List Analytics disk types
      description: Returns the disk types available for Analytics services, with their IOPS and throughput specifications. (Beta version)
      security:
