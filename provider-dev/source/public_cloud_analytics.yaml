          - Service references
          - Analytics
        - - Public Cloud
          - Analytics
          - Service references@@@30
      x-badges:
        - color: blue
          label: Beta version
      x-iam-actions:
        - name: publicCloudProject:apiovh:analytics/capabilities/get
          required: true
      x-stackql-bare-array-wrap:
        wrapperKey: managed_analytics_engines
        wrapperName: GetManagedAnalyticsEnginesResponse
        mediaType: application/json
