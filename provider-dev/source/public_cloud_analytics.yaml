      x-stackql-bare-array-wrap:
        wrapperKey: clickhouse_current_queries
        wrapperName: GetAllClickhouseCurrentQueriesResponse
        mediaType: application/json
        scalar: false
  /managedAnalytics/clickhouse/{serviceId}/currentQueries/{queryPid}:
    get:
      operationId: getClickhouseCurrentQuery
      summary: Get a running query
      description: Returns the SQL text, state and duration of a running query, identified by its process ID. (Beta version)
      security:
        - oAuth2AuthCode: []
      parameters:
        - in: query
          name: limit
          description: Maximum number of queries to return
          schema:
            type: integer
        - in: query
          name: offset
          description: Number of queries to skip before returning results
          schema:
            type: integer
        - in: path
          name: queryPid
          description: Query pid
          required: true
          schema:
            type: integer
        - in: path
          name: serviceId
          description: Service ID
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/publicCloud.database.CurrentQuery'
      tags:
        - Managed Analytics
        - ClickHouse
      x-developer-hub-navigation:
