              type: string
              description: Desired engine version. Available versions can be retrieved from the capabilities endpoint.
              nullable: true
      required:
        - targetSpec
    publicCloud.database.ServiceReplace:
      type: object
      description: 'Input parameters for replacing the configuration of a managed database service. Every field is required: the request describes the whole desired configuration.'
      properties:
        targetSpec:
          description: Desired configuration of the service
          type: object
          properties:
            advancedConfiguration:
              type: object
              description: Advanced configuration key-value pairs to apply to the service. Null for engines that do not support advanced configuration.
              nullable: true
              additionalProperties:
                type: string
            backup:
              description: Backup configuration for the service. Null for engines that do not support backups.
              nullable: true
              type: object
              properties:
                regions:
                  type: array
                  description: Regions where backups should be stored. Supported values depend on the engine and plan. Null for engines that do not support cross-region backups.
                  nullable: true
                  items:
                    $ref: '#/components/schemas/common.RegionEnum'
                time:
                  type: string
                  description: Preferred time of day for automatic backups, in HH:MM UTC format
              required:
                - regions
                - time
            deletionProtected:
              type: boolean
              description: Whether to protect this service from accidental deletion
            description:
              type: string
              description: Human-readable description of the service. Null removes the description.
              nullable: true
            flavor:
              type: string
              description: Desired compute flavor for the nodes. Available flavors can be retrieved from the capabilities endpoint.
            maintenanceWindow:
              description: Maintenance window configuration for the service
              type: object
              properties:
                startTimeUtc:
                  type: string
                  description: Preferred start time for maintenance windows, in HH:MM UTC format
              required:
                - startTimeUtc
            network:
              description: Updatable network configuration for the service. Only IP restrictions can be modified after creation.
              type: object
              properties:
                authorizedIps:
                  description: IP authorization configuration to apply to the service
                  type: object
                  properties:
                    rules:
                      type: array
                      description: Authorization entries. An empty list removes all restrictions, allowing access from any IP.
                      items:
                        $ref: '#/components/schemas/publicCloud.database.AuthorizedIpsRuleReplace'
                  required:
                    - rules
              required:
                - authorizedIps
            nodesCount:
              type: integer
              description: Desired number of nodes composing the cluster. Increasing or decreasing this value scales the cluster. The value must stay within the range accepted by the plan, exposed as specifications.nodes.minimum and specifications.nodes.maximum on the availability endpoint.
            plan:
              type: string
              description: Desired service plan. Available plans can be retrieved from the capabilities endpoint.
            prometheusEnabled:
              type: boolean
              description: Whether to enable Prometheus monitoring on this service. Null for engines that do not expose a Prometheus endpoint.
              nullable: true
            storage:
              description: Updatable storage configuration. Only size can be modified after creation. Null for engines that do not use block storage.
              nullable: true
              type: object
              properties:
                size:
                  description: Storage size allocated to the service
                  type: object
                  properties:
                    unit:
                      description: Unit of the value
                      type: string
                      enum:
                        - GB
                        - MB
                    value:
                      type: integer
                      description: Numeric value
                  required:
                    - unit
                    - value
              required:
                - size
            version:
              type: string
              description: Desired engine version. Available versions can be retrieved from the capabilities endpoint.
          required:
            - advancedConfiguration
            - backup
            - deletionProtected
            - description
            - flavor
            - maintenanceWindow
            - network
            - nodesCount
            - plan
            - prometheusEnabled
            - storage
            - version
      required:
        - targetSpec
