      type: object
      description: Availability of a database engine configuration
      properties:
        backups:
          description: Backup strategy for this availability
          readOnly: true
          type: object
          properties:
            available:
              type: boolean
              description: Whether backups are available for this offer
              readOnly: true
            retentionDays:
              type: integer
              description: Number of retention days for the backups
              nullable: true
              readOnly: true
        category:
          description: Category of the engine (database or analytics)
          readOnly: true
          type: string
          enum:
            - ANALYTICS
            - DATABASE
        default:
          type: boolean
          description: Whether this availability can be used by default
          readOnly: true
        engine:
          description: Database engine name
          readOnly: true
          type: string
          enum:
            - CLICKHOUSE
            - GRAFANA
            - KAFKA
            - KAFKA_CONNECT
            - KAFKA_MIRROR_MAKER
            - MONGODB
            - MYSQL
            - OPENSEARCH
            - POSTGRESQL
            - VALKEY
        lifecycle:
          description: Lifecycle information
          readOnly: true
          type: object
          properties:
            endOfLifeAt:
              type: string
              description: End of life date
              nullable: true
              format: date
              readOnly: true
            endOfSaleAt:
              type: string
              description: End of sale date
              nullable: true
              format: date
              readOnly: true
            startedAt:
              type: string
              description: Release date
              format: date
              readOnly: true
            status:
              description: Current status
              readOnly: true
              type: string
              enum:
                - BETA
                - DEPRECATED
                - END_OF_LIFE
                - END_OF_SALE
                - STABLE
                - UNAVAILABLE
        plan:
          type: string
          description: Plan name
          readOnly: true
        planCode:
          type: string
          description: Billing plan code
          readOnly: true
        planCodeStorage:
