                $ref: '#/components/schemas/GetManagedAnalyticsFlavorsResponse'
      tags:
        - Managed Analytics
        - Capabilities & availability
      x-developer-hub-navigation:
        - - Public Cloud
          - Project Management
          - Service references
          - Analytics
        - - Public Cloud
          - Analytics
          - Service references@@@60
      x-badges:
        - color: blue
          label: Beta version
      x-iam-actions:
        - name: publicCloudProject:apiovh:analytics/capabilities/get
          required: true
      x-stackql-bare-array-wrap:
        wrapperKey: managed_analytics_flavors
        wrapperName: GetManagedAnalyticsFlavorsResponse
        mediaType: application/json
        scalar: false
  /managedAnalytics/capabilities/options:
    get:
      operationId: getManagedAnalyticsOptions
      summary: List Analytics options
      description: Returns the options available for Analytics services and their data type. (Beta version)
      security:
        - oAuth2AuthCode: []
      parameters:
        - in: header
          name: X-Pagination-Cursor
          description: Pagination cursor
          schema:
            type: string
        - in: header
          name: X-Pagination-Size
          description: Pagination size
          schema:
