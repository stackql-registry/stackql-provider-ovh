        '200':
          description: successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetAllClickhouseServicesResponse'
      tags:
        - Managed Analytics
        - ClickHouse
      x-developer-hub-navigation:
        - - Public Cloud
          - Analytics
          - ClickHouse@@@10
      x-badges:
        - color: blue
          label: Beta version
      x-iam-actions:
        - name: publicCloudProject:apiovh:analytics/clickhouse/get
          required: true
      x-response-identifier: id
      x-expanded-response: PublicCloudDatabaseService
      x-stackql-bare-array-wrap:
        wrapperKey: clickhouse_services
        wrapperName: GetAllClickhouseServicesResponse
        mediaType: application/json
        scalar: false
    post:
      operationId: createClickhouseService
      summary: Create a ClickHouse service
      description: 'Creates a ClickHouse service from a plan, a flavor and an engine version. Creation is asynchronous: follow resourceStatus until READY. Set forkSourceServiceId to create it from a backup of another service. (Beta version)'
      security:
        - oAuth2AuthCode: []
      parameters: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/publicCloud.database.ServiceCreation'
      responses:
        '200':
          description: successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/publicCloud.database.Service'
      tags:
        - Managed Analytics
        - ClickHouse
      x-developer-hub-navigation:
        - - Public Cloud
          - Analytics
          - ClickHouse@@@30
      x-badges:
        - color: blue
          label: Beta version
      x-iam-actions:
        - name: publicCloudProject:apiovh:analytics/clickhouse/create
          required: true
  /managedAnalytics/clickhouse/{serviceId}:
    delete:
      operationId: deleteClickhouseService
      summary: Delete a ClickHouse service
      description: Deletes the service. A service with deletion protection enabled cannot be deleted. (Beta version)
      security:
        - oAuth2AuthCode: []
      parameters:
        - in: path
          name: serviceId
          description: Service ID
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/publicCloud.database.Service'
      tags:
        - Managed Analytics
        - ClickHouse
      x-developer-hub-navigation:
        - - Public Cloud
          - Analytics
          - ClickHouse@@@40
      x-badges:
        - color: blue
          label: Beta version
      x-iam-actions:
        - name: publicCloudProject:apiovh:analytics/clickhouse/delete
          required: true
    get:
      operationId: getClickhouseService
      summary: Get a ClickHouse service
      description: Returns the target specification of the service, its current state and its running tasks. (Beta version)
      security:
        - oAuth2AuthCode: []
      parameters:
        - in: path
          name: serviceId
          description: Service ID
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/publicCloud.database.Service'
      tags:
        - Managed Analytics
        - ClickHouse
      x-developer-hub-navigation:
        - - Public Cloud
          - Analytics
          - ClickHouse@@@20
      x-badges:
        - color: blue
          label: Beta version
      x-iam-actions:
        - name: publicCloudProject:apiovh:analytics/clickhouse/get
          required: true
      x-response-identifier: id
    patch:
      operationId: updateClickhouseService
      summary: Partially update a ClickHouse service
      description: Partially updates the target specification of the service, for example its plan, flavor, version or number of nodes. Omitted fields keep their current value. A new target specification is accepted only in READY status. (Beta version)
      security:
        - oAuth2AuthCode: []
      parameters:
        - in: path
          name: serviceId
          description: Service ID
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/publicCloud.database.ServiceUpdate'
      responses:
        '200':
          description: successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/publicCloud.database.Service'
      tags:
        - Managed Analytics
        - ClickHouse
      x-developer-hub-navigation:
        - - Public Cloud
          - Analytics
          - ClickHouse@@@60
      x-badges:
        - color: blue
          label: Beta version
      x-iam-actions:
        - name: publicCloudProject:apiovh:analytics/clickhouse/edit
          required: true
    put:
      operationId: editClickhouseService
      summary: Update a ClickHouse service
      description: 'Updates the target specification of the service, for example its plan, flavor, version or number of nodes. Every field is required: the request describes the whole configuration. A new target specification is accepted only in READY status. (Beta version)'
      security:
        - oAuth2AuthCode: []
      parameters:
        - in: path
          name: serviceId
          description: Service ID
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/publicCloud.database.ServiceReplace'
      responses:
        '200':
          description: successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/publicCloud.database.Service'
      tags:
        - Managed Analytics
        - ClickHouse
      x-developer-hub-navigation:
        - - Public Cloud
          - Analytics
          - ClickHouse@@@50
      x-badges:
        - color: blue
          label: Beta version
      x-iam-actions:
        - name: publicCloudProject:apiovh:analytics/clickhouse/edit
          required: true
  /managedAnalytics/clickhouse/{serviceId}/certificates:
