      responses:
        '200':
          description: successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetManagedAnalyticsOptionsResponse'
      tags:
        - Managed Analytics
        - Capabilities & availability
      x-developer-hub-navigation:
        - - Public Cloud
          - Project Management
          - Service references
          - Analytics
        - - Public Cloud
          - Analytics
          - Service references@@@80
      x-badges:
        - color: blue
          label: Beta version
      x-iam-actions:
        - name: publicCloudProject:apiovh:analytics/capabilities/get
          required: true
      x-stackql-bare-array-wrap:
        wrapperKey: managed_analytics_options
        wrapperName: GetManagedAnalyticsOptionsResponse
        mediaType: application/json
        scalar: false
  /managedAnalytics/capabilities/plans:
    get:
      operationId: getManagedAnalyticsPlans
      summary: List Analytics plans
      description: Returns the plans available for Analytics services, with their description and automatic backup retention. (Beta version)
      security:
        - oAuth2AuthCode: []
      parameters:
        - in: header
          name: X-Pagination-Cursor
          description: Pagination cursor
          schema:
            type: string
        - in: header
          name: X-Pagination-Size
          description: Pagination size
          schema:
            type: integer
      responses:
        '200':
          description: successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetManagedAnalyticsPlansResponse'
      tags:
        - Managed Analytics
        - Capabilities & availability
      x-developer-hub-navigation:
        - - Public Cloud
          - Project Management
          - Service references
          - Analytics
        - - Public Cloud
          - Analytics
          - Service references@@@50
      x-badges:
        - color: blue
          label: Beta version
      x-iam-actions:
        - name: publicCloudProject:apiovh:analytics/capabilities/get
