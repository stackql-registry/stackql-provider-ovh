          required: true
  /managedAnalytics/clickhouse/{serviceId}/database:
    get:
      operationId: getAllClickhouseDatabases
      summary: List databases
      description: Returns the databases of the service, including the engine default database. (Beta version)
      security:
        - oAuth2AuthCode: []
      parameters:
        - in: header
          name: X-Pagination-Cursor
          description: Pagination cursor
          schema:
            type: string
        - in: header
          name: X-Pagination-Size
          description: Pagination size
          schema:
            type: integer
        - in: path
          name: serviceId
          description: Service ID
