      x-response-identifier: pid
  /managedAnalytics/clickhouse/{serviceId}/currentQueries/{queryPid}/cancel:
    post:
      operationId: cancelClickhouseCurrentQuery
      summary: Cancel a running query
      description: Cancels a running query gracefully. Set terminate to true to force its termination instead. (Beta version)
      security:
        - oAuth2AuthCode: []
      parameters:
        - in: path
          name: queryPid
          description: Query pid
          required: true
          schema:
            type: integer
        - in: path
          name: serviceId
          description: Service ID
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/publicCloud.database.QueryCancelRequest'
      responses:
        '200':
          description: successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/publicCloud.database.QueryCancelResult'
      tags:
        - Managed Analytics
        - ClickHouse
      x-developer-hub-navigation:
        - - Public Cloud
          - Analytics
          - ClickHouse
          - Queries@@@30
      x-badges:
        - color: blue
          label: Beta version
      x-iam-actions:
