      responses:
        '200':
          description: successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetManagedAnalyticsDisksResponse'
      tags:
        - Managed Analytics
        - Capabilities & availability
      x-developer-hub-navigation:
        - - Public Cloud
          - Project Management
          - Service references
          - Analytics
        - - Public Cloud
          - Analytics
          - Service references@@@70
      x-badges:
        - color: blue
          label: Beta version
      x-iam-actions:
        - name: publicCloudProject:apiovh:analytics/capabilities/get
          required: true
      x-stackql-bare-array-wrap:
        wrapperKey: managed_analytics_disks
        wrapperName: GetManagedAnalyticsDisksResponse
        mediaType: application/json
        scalar: false
  /managedAnalytics/capabilities/engines:
    get:
      operationId: getManagedAnalyticsEngines
      summary: List Analytics engines
